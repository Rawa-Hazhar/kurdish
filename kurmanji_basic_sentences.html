<!DOCTYPE html>
<html lang="kmr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hevokên Bingehîn - Kurmancî | Hîngeha Zimanê Kurdî</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fa/css/all.min.css">
    <style>
        :root {
            --font-main: 'Poppins', sans-serif;
            --font-kurdish-sorani: 'Vazirmatn', sans-serif;
            --primary-color: #2c3e50;
            --secondary-color: #e67e22;
            --accent-color: #27ae60;
            --accent-hover-color: #2ecc71;
            --light-bg-color: #f4f6f7;
            --card-bg-color: white;
            --text-color: #34495e;
            --muted-text-color: #7f8c8d;
            --white-color: #ffffff;
            --border-radius-sm: 5px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --box-shadow: 0 4px 10px rgba(0, 0, 0, 0.07);
            --transition-speed: 0.3s;
            --border-color: #e0e6e8;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main), sans-serif; background-color: var(--light-bg-color); color: var(--text-color); line-height: 1.7; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; margin: 20px auto; padding: 30px; background-color: var(--card-bg-color); border-radius: var(--border-radius-lg); box-shadow: var(--box-shadow); flex-grow: 1; }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        header h1 { color: var(--primary-color); font-size: 2.4rem; font-weight: 700; }
        header h1 i { margin-right: 10px; color: var(--accent-color); }
        #kurmanji-navbar-placeholder { margin-bottom: 20px; }
        .page-navigation { display: flex; justify-content: center; gap: 15px; width: 100%; flex-wrap: wrap; }
        .nav-link-button { font-family: var(--font-main), sans-serif; background: linear-gradient(135deg, var(--secondary-color), #d35400); color: var(--white-color); border: none; border-radius: var(--border-radius-sm); padding: 10px 20px; cursor: pointer; transition: all var(--transition-speed) ease; font-weight: 600; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .nav-link-button i { margin-right: 8px; }
        .nav-link-button:hover, .nav-link-button:focus-visible { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(230, 126, 34, 0.3); outline: none; }
        main { padding-top: 10px; }
        #basic-sentences-section h2 { font-size: 2rem; color: var(--primary-color); text-align: center; margin-bottom: 15px; }
        .section-description { font-size: 1.1rem; color: var(--muted-text-color); text-align: center; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .sentence-list { list-style: none; padding: 0; }
        .sentence-item { background-color: var(--white-color); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; transition: box-shadow var(--transition-speed); }
        .sentence-item:hover { box-shadow: var(--box-shadow); }
        .sentence-content { flex-grow: 1; margin-right: 15px; }
        .sentence-kurmanji { font-size: 1.2rem; font-weight: 500; color: var(--text-color); margin-bottom: 5px; }
        .sentence-english { font-size: 0.95rem; color: var(--muted-text-color); font-style: italic; }
        .play-sentence-btn { background-color: var(--accent-color); color: var(--white-color); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; transition: background-color var(--transition-speed), transform var(--transition-speed); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .play-sentence-btn:hover, .play-sentence-btn:focus-visible { background-color: var(--accent-hover-color); transform: scale(1.1); outline: none; }
        .play-sentence-btn.playing { animation: pulse var(--transition-speed) infinite alternate; }
        @keyframes pulse { to { transform: scale(1.1); box-shadow: 0 0 10px var(--accent-hover-color); } }
        footer { text-align: center; margin-top: 40px; padding: 20px; font-size: 0.9rem; color: var(--muted-text-color); border-top: 1px solid var(--border-color); width: 100%; }
        .footer-sorani-text { font-family: var(--font-kurdish-sorani), sans-serif; direction: rtl; }
    </style>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/audio-map.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-comments"></i> Hevokên Bingehîn</h1>
        </header>

        <div id="kurmanji-navbar-placeholder"></div>

        <main>
            <section id="basic-sentences-section">
                <h2>Hevokên Rojane yên Kurmancî</h2>
                <p class="section-description">Fêrî hevokên bingehîn bibe ji bo danûstandinên rojane. Li bilêvkirinê guhdarî bike.</p>
                <ul class="sentence-list" id="sentenceListContainer"></ul>
            </section>
        </main>

        <footer>
            <p lang="kmr" dir="ltr">&copy; <span id="current-year-kmr"></span> Hîngeha Zimanê Kurdî. Hemû maf parastî ne.</p>
            <p class="footer-sorani-text"><span id="current-year-sor"></span> فێرگەی زمانی کوردی. هەموو مافەکان پارێزراون.</p>
        </footer>
    </div>
    
    <script>
        const basicSentencesKurmanji = [
            { id: 1, kurmanji: "Rojbaş.", english: "Good morning / Good day.", audio: "audio/kurmanji_sentences/bs_01_rojbas.mp3" },
            { id: 2, kurmanji: "Beyanî baş.", english: "Good morning.", audio: "audio/kurmanji_sentences/bs_02_beyani_bas.mp3" },
            { id: 3, kurmanji: "Êvar baş.", english: "Good evening.", audio: "audio/kurmanji_sentences/bs_03_evar_bas.mp3" },
            { id: 4, kurmanji: "Şev baş.", english: "Good night.", audio: "audio/kurmanji_sentences/bs_04_sev_bas.mp3" },
            { id: 5, kurmanji: "Silav.", english: "Hello / Hi.", audio: "audio/kurmanji_sentences/bs_05_silav.mp3" },
            { id: 6, kurmanji: "Tu çawan î?", english: "How are you? (informal)", audio: "audio/kurmanji_sentences/bs_06_tu_cawan_i.mp3" },
            { id: 7, kurmanji: "Ez baş im, spas.", english: "I'm fine, thank you.", audio: "audio/kurmanji_sentences/bs_07_ez_bas_im_spas.mp3" },
            { id: 8, kurmanji: "Spas dikim.", english: "Thank you.", audio: "audio/kurmanji_sentences/bs_08_spas_dikim.mp3" },
            { id: 9, kurmanji: "Ji kerema xwe.", english: "Please. / You're welcome.", audio: "audio/kurmanji_sentences/bs_09_ji_kerema_xwe.mp3" },
            { id: 10, kurmanji: "Navê min Delal e.", english: "My name is Delal.", audio: "audio/kurmanji_sentences/bs_10_nave_min_delal_e.mp3" },
            { id: 11, kurmanji: "Navê te çi ye?", english: "What is your name?", audio: "audio/kurmanji_sentences/bs_11_nave_te_ci_ye.mp3" },
            { id: 12, kurmanji: "Tu ji ku derê yî?", english: "Where are you from?", audio: "audio/kurmanji_sentences/bs_12_tu_ji_ku_dere_yi.mp3" },
            { id: 13, kurmanji: "Ez ji Kurdistanê me.", english: "I am from Kurdistan.", audio: "audio/kurmanji_sentences/bs_13_ez_ji_kurdistane_me.mp3" },
            { id: 14, kurmanji: "Erê.", english: "Yes.", audio: "audio/kurmanji_sentences/bs_14_ere.mp3" },
            { id: 15, kurmanji: "Na.", english: "No.", audio: "audio/kurmanji_sentences/bs_15_na.mp3" },
            { id: 16, kurmanji: "Bibore.", english: "Excuse me. / Sorry.", audio: "audio/kurmanji_sentences/bs_16_bibore.mp3" },
            { id: 17, kurmanji: "Ez fêm nakim.", english: "I don't understand.", audio: "audio/kurmanji_sentences/bs_17_ez_fem_nakim.mp3" },
            { id: 18, kurmanji: "Bi xatirê te.", english: "Goodbye.", audio: "audio/kurmanji_sentences/bs_18_bi_xatire_te.mp3" }
        ];
        const sentenceListContainer = document.getElementById('sentenceListContainer');
        let currentAudioPlayer = null;
        function populateSentenceList() {
            if (!sentenceListContainer) return;
            sentenceListContainer.innerHTML = ''; 
            basicSentencesKurmanji.forEach(sentence => {
                const listItem = document.createElement('li');
                listItem.className = 'sentence-item';
                listItem.innerHTML = `
                    <div class="sentence-content">
                        <p class="sentence-kurmanji">${sentence.kurmanji}</p>
                        <p class="sentence-english">${sentence.english}</p>
                    </div>
                    <button class="play-sentence-btn" data-audio-src="${sentence.audio}" aria-label="Guhdarî bike: ${sentence.kurmanji}">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                `;
                sentenceListContainer.appendChild(listItem);
            });
            document.querySelectorAll('.play-sentence-btn').forEach(button => {
                button.addEventListener('click', function() { playAudio(this.dataset.audioSrc, this); });
            });
        }
        function playAudio(src, buttonElement) {
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                document.querySelectorAll('.play-sentence-btn.playing').forEach(btn => btn.classList.remove('playing'));
            }
            if (!src) return;
            currentAudioPlayer = new Audio(src);
            if (buttonElement) buttonElement.classList.add('playing');
            currentAudioPlayer.play().catch(e => { console.error(`Error playing audio ${src}:`, e); if (buttonElement) buttonElement.classList.remove('playing'); });
            currentAudioPlayer.onended = () => { if (buttonElement) buttonElement.classList.remove('playing'); };
            currentAudioPlayer.onerror = (e) => { if (buttonElement) buttonElement.classList.remove('playing'); };
        }
        document.addEventListener('DOMContentLoaded', () => {
            populateSentenceList();
            const currentYear = new Date().getFullYear();
            const currentYearKmr = document.getElementById('current-year-kmr');
            const currentYearSor = document.getElementById('current-year-sor');
            if (currentYearKmr) currentYearKmr.textContent = currentYear;
            if (currentYearSor) currentYearSor.textContent = currentYear.toLocaleString('ar-EG');
        });
    </script>
</body>
</html>
