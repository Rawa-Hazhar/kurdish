<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕستە دروستکەر - فێرگەی کوردی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/fa/css/all.min.css">

    <style>
        :root {
            --font-kurdish: 'Vazirmatn', sans-serif; 
            --font-latin: 'Poppins', sans-serif;
            --primary-color: #2c3e50; 
            --secondary-color: #e67e22; 
            --accent-color: #3498db;
            --accent-hover-color: #2980b9; 
            --light-bg-color: #ecf0f1; 
            --card-bg-color: white;
            --text-color: #34495e; 
            --muted-text-color: #7f8c8d; 
            --success-color: #27ae60;
            --success-hover-color: #2ecc71;
            --danger-color: #c0392b;
            --danger-hover-color: #e74c3c;
            --warning-color: #f39c12;
            --white-color: #ffffff; 
            --border-radius-sm: 5px;
            --border-radius-md: 8px; 
            --border-radius-lg: 12px; 
            --box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            --box-shadow-hover: 0 6px 15px rgba(0, 0, 0, 0.12); 
            --transition-speed: 0.3s;
            --border-color: #dfe4e7;
        }

        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: var(--font-kurdish), sans-serif; 
            background-color: var(--light-bg-color); 
            color: var(--text-color); 
            line-height: 1.8; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        .container { 
            width: 100%; 
            max-width: 950px; 
            margin: 20px auto; 
            padding: 25px; 
            background-color: var(--card-bg-color); 
            border-radius: var(--border-radius-lg); 
            box-shadow: var(--box-shadow); 
            flex-grow: 1; 
        }

        header { 
            text-align: center; 
            margin-bottom: 30px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid var(--border-color); 
        }
        header h1 { 
            color: var(--primary-color); 
            font-size: 2.3rem; 
            font-weight: 700; 
        }
        header h1 i { 
            margin-left: 10px; 
            color: var(--secondary-color); 
        }
        
        /* Navigation Bar Styles */
        .page-navigation {
            display: flex;
            justify-content: center; 
            gap: 15px; 
            margin-top: 20px; 
            margin-bottom: 25px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid var(--border-color); 
            width: 100%; 
        }
        .nav-link-button {
            font-family: var(--font-kurdish), sans-serif;
            background: linear-gradient(135deg, var(--secondary-color), #d35400); 
            color: var(--white-color);
            border: none;
            border-radius: var(--border-radius-sm);
            padding: 8px 18px; 
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            font-weight: 600;
            font-size: 0.9rem; 
            box-shadow: 0 2px 5px rgba(230, 126, 34, 0.2); 
            text-decoration: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .nav-link-button i { margin-left: 8px; }
        .nav-link-button:hover, .nav-link-button:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(230, 126, 34, 0.3); 
            outline: none;
            background: linear-gradient(135deg, #d35400, var(--secondary-color)); 
        }
        
        #theme-selection { 
            margin-bottom: 30px; 
            padding: 20px; 
            background-color: #f8f9f9; 
            border-radius: var(--border-radius-md); 
            border: 1px solid var(--light-bg-color); 
        }
        #theme-selection h2 { 
            text-align: center; 
            color: var(--primary-color); 
            margin-bottom: 20px; 
            font-size: 1.4rem; 
        }

        .button-group { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
        }
        .btn { 
            font-family: var(--font-kurdish), sans-serif; 
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover-color)); 
            color: var(--white-color); 
            border: none; 
            border-radius: var(--border-radius-sm); 
            padding: 10px 20px; 
            cursor: pointer; 
            transition: all var(--transition-speed) ease; 
            font-weight: 600; 
            font-size: 0.95rem; 
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.2); 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
        }
        .btn i { margin-left: 8px; }
        .btn:hover, .btn:focus-visible { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3); 
            outline: none; 
        }
        .btn.active { 
            filter: brightness(1.1); 
            transform: translateY(-1px); 
            box-shadow: 0 0 0 2px var(--white-color), 0 3px 6px rgba(52, 152, 219, 0.3); 
        }
         .btn.danger { background: linear-gradient(135deg, var(--danger-color), var(--danger-hover-color)); } 
         .btn.success { background: linear-gradient(135deg, var(--success-color), var(--success-hover-color)); } 
         .btn.warning { background: linear-gradient(135deg, var(--warning-color), #d98c0f); } 

        #sentence-builder-activity { 
            animation: fadeInContent 0.5s ease-out; 
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        @keyframes fadeInContent { from { opacity: 0; } to { opacity: 1; } }
        
        .activity-instructions {
            text-align: center;
            font-size: 1.1rem;
            color: var(--muted-text-color);
            margin-bottom: 20px;
        }
        #sentence-structure-display { /* Now just displays structure */
            text-align: center;
            font-size: 1.1rem; /* Slightly smaller */
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px; /* Less margin */
            padding: 5px;
            background-color: #f0f4f8;
            border-radius: var(--border-radius-sm);
        }
        #sentence-structure-display span {
            color: var(--secondary-color);
            margin: 0 5px;
        }
        /* New Area for Target Sentence Hint */
        #target-sentence-hint-area {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color); /* Use accent color for hint */
            margin-bottom: 25px;
            padding: 10px;
            background-color: #eaf2f8; /* Lighter blue background */
            border: 1px dashed var(--accent-color);
            border-radius: var(--border-radius-sm);
            font-style: italic; 
            display: none; /* Hidden by default */
        }

        #sentence-slots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 80px;
            background-color: var(--white-color);
            border: 2px dashed var(--accent-color);
            border-radius: var(--border-radius-md);
        }

        .sentence-slot {
            min-width: 100px;
            min-height: 50px;
            background-color: var(--light-bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            color: var(--muted-text-color);
            font-style: italic;
            font-size: 0.9rem;
            transition: background-color var(--transition-speed);
        }
        .sentence-slot.over { 
            background-color: #d6eaf8; 
            border-style: solid;
        }
        .sentence-slot .word-card { 
             margin: 0; 
             box-shadow: none;
             font-size: 1.1rem; 
        }

        #word-bank {
            padding: 20px;
            margin-bottom: 30px;
            background-color: #f0f4f8;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            min-height: 70px;
        }
        #word-bank h4 {
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 400;
        }

        .word-card {
            background-color: var(--white-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            cursor: grab; /* Make it clear it's draggable */
            font-size: 1rem;
            font-weight: 600;
            box-shadow: var(--box-shadow);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            text-align: center;
            user-select: none; 
        }
        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-hover);
        }
        .word-card.dragging {
            opacity: 0.5;
            background-color: var(--accent-hover-color);
            color: var(--white-color);
            cursor: grabbing;
        }
        /* Type-based styling (optional but helpful) */
        .word-card[data-type="noun"] { border-left: 4px solid var(--secondary-color); }
        .word-card[data-type="verb"] { border-left: 4px solid var(--danger-color); }
        .word-card[data-type="pronoun"] { border-left: 4px solid var(--accent-color); }
        .word-card[data-type="adjective"] { border-left: 4px solid var(--success-color); }
        .word-card[data-type="preposition"] { border-left: 4px solid var(--warning-color); } 

        #controls-area {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap; /* Allow buttons to wrap */
            justify-content: center;
            gap: 15px;
        }
        #feedback-area {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 1.5em; 
            padding: 10px;
            border-radius: var(--border-radius-sm);
        }
        .feedback-correct { color: var(--success-color); background-color: #e8f8f5; border: 1px solid var(--success-color);}
        .feedback-incorrect { color: var(--danger-color); background-color: #fdedec; border: 1px solid var(--danger-color); }

        footer { 
            text-align: center; 
            margin-top: 40px; 
            padding: 15px; 
            font-size: 0.9rem; 
            color: var(--muted-text-color); 
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; margin: 10px auto; }
            header h1 { font-size: 2rem; }
            #sentence-slots { flex-wrap: wrap; padding: 15px; }
            .sentence-slot { min-width: 80px; min-height: 45px; font-size: 0.8rem;}
            .word-card { font-size: 0.9rem; padding: 6px 12px;}
        }
         @media (max-width: 480px) {
             .btn { padding: 8px 15px; font-size: 0.9rem; }
             #sentence-structure-display { font-size: 1rem; }
             #target-sentence-hint-area { font-size: 1rem; }
         }
    </style>

</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-puzzle-piece"></i> ڕستە دروستکەر</h1>
        </header>

        

        <section id="theme-selection">
            <h2>بابەتێک هەڵبژێرە:</h2>
            <div class="button-group" id="theme-buttons">
                </div>
        </section>

        <main id="sentence-builder-activity" style="display: none;">
            <p class="activity-instructions">وشەکان ڕابکێشە بۆ دروستکردنی ڕستەیەکی ڕاست.</p>
            
            <div id="sentence-structure-display">پێکهاتە: <span>...</span></div> 
            <div id="target-sentence-hint-area"></div> 

            <div id="sentence-slots">
                </div>
            
            <div id="word-bank">
                <h4>وشە بەردەستەکان:</h4>
                </div>
            
            <div id="controls-area">
                <button id="check-sentence-btn" class="btn success"><i class="fa-solid fa-check"></i> دڵنیابوونەوە</button>
                <button id="new-sentence-btn" class="btn"><i class="fa-solid fa-lightbulb"></i> ڕستەی نوێ</button>
                <button id="show-target-btn" class="btn warning"><i class="fa-solid fa-eye"></i> پیشاندانی ڕستەی ئامانج</button>
            </div>
            <div id="feedback-area"></div>
        </main>
    </div>

    <footer class="site-footer"> 
        <p>&copy; <span id="current-year"></span> فێرگەی زمانی کوردی. هەموو مافەکان پارێزراون.</p>
    </footer>

    <script>
        // --- DATA STRUCTURE (Refined for Meaningful Sentences) ---
        
        // Define words separately
        const words = {
            // Pronouns
            pro_1: { word_ku: "من", type: "pronoun" },
            pro_2: { word_ku: "تۆ", type: "pronoun" },
            pro_3: { word_ku: "ئەو", type: "pronoun" },
            pro_4: { word_ku: "ئێمە", type: "pronoun" },
            pro_5: { word_ku: "ئێوە", type: "pronoun" },
            pro_6: { word_ku: "ئەوان", type: "pronoun" },
            // Nouns (Family)
            noun_15: { word_ku: "دایکم", type: "noun" },
            noun_16: { word_ku: "باوکم", type: "noun" },
            noun_17: { word_ku: "خوشکەکەم", type: "noun" },
            noun_18: { word_ku: "براکەم", type: "noun" },
            noun_19: { word_ku: "کوڕەکە", type: "noun" },
            noun_20: { word_ku: "کچەکە", type: "noun" },
            noun_22: { word_ku: "کتێب", type: "noun"},
            noun_23: { word_ku: "تۆپ", type: "noun"},
             // Nouns (Food)
            noun_1: { word_ku: "نان", type: "noun"},
            noun_3: { word_ku: "سێو", type: "noun"}, 
            noun_4: { word_ku: "پەنیر", type: "noun"},
            noun_5: { word_ku: "هێلکە", type: "noun"},
            noun_6: { word_ku: "ماسی", type: "noun"},
            noun_7: { word_ku: "چای", type: "noun"},
            noun_8: { word_ku: "قاوە", type: "noun"},
            // Nouns (Clothes) 
            noun_c1: { word_ku: "کراس", type: "noun"},
            noun_c2: { word_ku: "پانتۆڵ", type: "noun"},
            noun_c3: { word_ku: "کڵاو", type: "noun"},
            noun_c4: { word_ku: "پێڵاو", type: "noun"}, 
            noun_c5: { word_ku: "کراسێکی", type: "noun"}, // A shirt
            noun_c6: { word_ku: "کڵاوێکی", type: "noun"}, // A hat
            // Verbs (Family/General)
            verb_1: { word_ku: "دەخۆم", type: "verb"}, // I eat
            verb_3: { word_ku: "دەخوێنێتەوە", type: "verb"}, // He/She reads
            verb_5: { word_ku: "دەمەوێت", type: "verb"}, // I want
            verb_7: { word_ku: "دەخوات", type: "verb"}, // He/She eats
            verb_8: { word_ku: "دەخۆین", type: "verb"}, // We eat
            verb_10: { word_ku: "هەیە", type: "verb"}, // He/She has
            verb_11: { word_ku: "دەخۆیت", type: "verb"}, // You eat
            verb_12: { word_ku: "تۆپێن دەکات", type: "verb"}, // He/She plays football
            // Verbs (Clothes)
            verb_c1: { word_ku: "دەکڕم", type: "verb"}, // I buy
            verb_c2: { word_ku: "دەکڕێت", type: "verb"}, // He/She buys
            verb_c3: { word_ku: "لەپێ دەکات", type: "verb"}, // He/She wears (shoes)
            verb_c4: { word_ku: "لەسەر دەکات", type: "verb"}, // He/She wears (hat)
            verb_c5: { word_ku: "لەبەر دەکات", type: "verb"}, // He/She wears (clothes)
            verb_c6: { word_ku: "لەسەر دەکەیت", type: "verb"}, // You wear (hat)
            // Adjectives
            adj_1: { word_ku: "بچووک", type: "adjective"},
            adj_2: { word_ku: "گەورە", type: "adjective"},
            adj_3: { word_ku: "نوێ", type: "adjective"}, 
            adj_c1: { word_ku: "ڕەش", type: "adjective"}, 
            adj_c2: { word_ku: "سپی", type: "adjective"}, 
            adj_c3: { word_ku: "جوان", type: "adjective"} 
        };

        // Define specific meaningful sentences
        const sentenceExamples = {
            'خێزان': [
                {
                    id: 'fam_s1',
                    structure: ['pronoun', 'noun', 'verb'], 
                    structure_ku: "جێناو + ناو + کردار", 
                    target_sentence_ku: "من سێو دەخۆم.", 
                    correct_words: [words.pro_1, words.noun_3, words.verb_1], 
                    distractors: [words.noun_1, words.verb_3, words.pro_3] 
                },
                {
                    id: 'fam_s2',
                    structure: ['noun', 'noun', 'verb'], 
                    structure_ku: "ناو + ناو + کردار", 
                    target_sentence_ku: "کچەکە کتێب دەخوێنێتەوە.", 
                    correct_words: [words.noun_20, words.noun_22, words.verb_3], 
                    distractors: [words.noun_19, words.verb_1, words.noun_23] 
                },
                { 
                    id: 'fam_s3', // Corrected ID
                    structure: ['noun', 'verb'], 
                    structure_ku: "ناو + کردار", 
                    target_sentence_ku: "کوڕەکە تۆپێن دەکات.", 
                    correct_words: [words.noun_19, words.verb_12], 
                    distractors: [words.noun_17, words.adj_1, words.verb_10] 
                },
                 {
                    id: 'fam_s4',
                    structure: ['pronoun', 'noun', 'verb'], 
                    structure_ku: "جێناو + ناو + کردار", 
                    target_sentence_ku: "ئەو کتێب دەخوێنێتەوە.", 
                    correct_words: [words.pro_3, words.noun_22, words.verb_3], 
                    distractors: [words.noun_7, words.verb_1, words.pro_1] 
                }
            ],
            'خواردن': [
                 {
                    id: 'food_s1',
                    structure: ['pronoun', 'noun', 'verb'], 
                    structure_ku: "جێناو + ناو + کردار", 
                    target_sentence_ku: "ئەو پەنیر دەخوات.", 
                    correct_words: [words.pro_3, words.noun_4, words.verb_7], 
                    distractors: [words.pro_4, words.noun_6, words.verb_8] 
                },
                 {
                    id: 'food_s2',
                    structure: ['pronoun', 'noun', 'verb'], 
                    structure_ku: "جێناو + ناو + کردار", 
                    target_sentence_ku: "ئێمە ماسی دەخۆین.", 
                    correct_words: [words.pro_4, words.noun_6, words.verb_8], 
                    distractors: [words.pro_2, words.noun_8, words.verb_11] 
                }
            ],
             'جل و بەرگ': [ 
                 {
                    id: 'clothes_s1',
                    structure: ['pronoun', 'noun', 'verb'], 
                    structure_ku: "جێناو + ناو + کردار", 
                    target_sentence_ku: "من کراس دەکڕم.", 
                    correct_words: [words.pro_1, words.noun_c1, words.verb_c1], 
                    distractors: [words.pro_2, words.noun_c2, words.verb_c2] 
                },
                { 
                    id: 'clothes_s2', // Corrected ID
                    structure: ['pronoun', 'noun', 'adjective', 'verb'], // Structure adjusted for Kurdish word order
                    structure_ku: "جێناو + ناو + ئاوەڵناو + کردار", 
                    target_sentence_ku: "ئەو پێڵاوی ڕەش لەپێ دەکات.", 
                    correct_words: [words.pro_3, words.noun_c4, words.adj_c1, words.verb_c3], 
                    distractors: [words.adj_c2, words.noun_c5, words.verb_c5] 
                },
                { 
                    id: 'clothes_s3', // Corrected ID
                    structure: ['pronoun', 'noun', 'adjective', 'verb'], 
                    structure_ku: "جێناو + ناو + ئاوەڵناو + کردار", 
                    target_sentence_ku: "تۆ کڵاوێکی گەورە لەسەر دەکەیت.", 
                    correct_words: [words.pro_2, words.noun_c6, words.adj_2, words.verb_c6], 
                    distractors: [words.pro_1, words.adj_1, words.verb_c3] 
                }
             ]
        };

        // Mapping for placeholder text
        const kurdishWordTypes = {
            pronoun: 'جێناو',
            noun: 'ناو',
            verb: 'کردار',
            adjective: 'ئاوەڵناو',
            preposition: 'ئامراز' 
        };

        // --- STATE VARIABLES ---
        let currentSelectedTheme = null;
        let currentSentenceExample = null; 
        let currentCorrectWordSequence = []; 
        let draggedWordElement = null; 

        // --- DOM Elements Cache ---
        const themeButtonsContainer = document.getElementById('theme-buttons');
        const sentenceBuilderActivityDiv = document.getElementById('sentence-builder-activity');
        const sentenceStructureDisplayEl = document.getElementById('sentence-structure-display'); 
        const targetSentenceHintArea = document.getElementById('target-sentence-hint-area'); // Added
        const sentenceSlotsDiv = document.getElementById('sentence-slots');
        const wordBankDiv = document.getElementById('word-bank');
        const checkSentenceBtn = document.getElementById('check-sentence-btn');
        const newSentenceBtn = document.getElementById('new-sentence-btn');
        const showTargetBtn = document.getElementById('show-target-btn'); // Added
        const feedbackArea = document.getElementById('feedback-area');
        const currentYearEl = document.getElementById('current-year');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            populateThemeButtons();
            if (currentYearEl) { currentYearEl.textContent = new Date().getFullYear(); }
            
            checkSentenceBtn.addEventListener('click', checkConstructedSentence);
            newSentenceBtn.addEventListener('click', loadNewSentencePattern); 
            showTargetBtn.addEventListener('click', showTargetSentenceHint); // Added listener

            // Add drag listeners using event delegation
            wordBankDiv.addEventListener('dragstart', handleDragStart);
            wordBankDiv.addEventListener('dragend', handleDragEnd);
            sentenceSlotsDiv.addEventListener('dragstart', handleDragStart); // **** ADDED THIS LINE ****
            sentenceSlotsDiv.addEventListener('dragend', handleDragEnd);     // **** ADDED THIS LINE ****
        });

        function populateThemeButtons() {
            themeButtonsContainer.innerHTML = '';
            for (const themeName in sentenceExamples) { 
                if (sentenceExamples[themeName] && sentenceExamples[themeName].length > 0) {
                    const button = document.createElement('button');
                    button.className = 'btn';
                    let iconClass = 'fa-solid fa-bars-staggered'; 
                    if (themeName === 'خێزان') iconClass = 'fa-solid fa-users';
                    else if (themeName === 'خواردن') iconClass = 'fa-solid fa-utensils';
                    else if (themeName === 'جل و بەرگ') iconClass = 'fa-solid fa-shirt'; 
                    
                    button.innerHTML = `<i class="${iconClass}"></i> ${themeName}`;
                    button.onclick = (function(name, btnEl) {
                        return function() { selectThemeForSentences(name, btnEl); };
                    })(themeName, button);
                    themeButtonsContainer.appendChild(button);
                }
            }
        }

        function selectThemeForSentences(themeName, clickedButton) {
            currentSelectedTheme = themeName;
            document.querySelectorAll('#theme-buttons .btn').forEach(btn => btn.classList.remove('active'));
            if (clickedButton) clickedButton.classList.add('active');
            
            sentenceBuilderActivityDiv.style.display = 'block';
            loadNewSentencePattern();
        }

        function loadNewSentencePattern() { 
            if (!currentSelectedTheme || !sentenceExamples[currentSelectedTheme] || sentenceExamples[currentSelectedTheme].length === 0) {
                 feedbackArea.textContent = "هیچ ڕستەیەک بۆ ئەم بابەتە نییە.";
                 feedbackArea.className = 'feedback-incorrect'; 
                 sentenceSlotsDiv.innerHTML = '';
                 wordBankDiv.innerHTML = '<h4>وشە بەردەستەکان:</h4>';
                 sentenceStructureDisplayEl.textContent = 'پێکهاتە: ...'; 
                 targetSentenceHintArea.style.display = 'none'; 
                 targetSentenceHintArea.textContent = ''; 
                 return;
            }
            
            const examplesInTheme = sentenceExamples[currentSelectedTheme];
            currentSentenceExample = examplesInTheme[Math.floor(Math.random() * examplesInTheme.length)];
            currentCorrectWordSequence = currentSentenceExample.correct_words; 
            
            feedbackArea.textContent = '';
            feedbackArea.className = ''; 
            sentenceStructureDisplayEl.textContent = `پێکهاتە: ${currentSentenceExample.structure_ku}`; 
            targetSentenceHintArea.style.display = 'none';
            targetSentenceHintArea.textContent = '';

            // Create sentence slots
            sentenceSlotsDiv.innerHTML = '';
            currentSentenceExample.structure.forEach(slotType => { 
                const slot = document.createElement('div');
                slot.className = 'sentence-slot';
                slot.dataset.expectedType = slotType; 
                slot.textContent = kurdishWordTypes[slotType] || slotType; 
                
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('dragenter', handleDragEnter);
                slot.addEventListener('dragleave', handleDragLeave);
                slot.addEventListener('drop', handleDrop);
                
                sentenceSlotsDiv.appendChild(slot);
            });

            // Populate word bank
            wordBankDiv.innerHTML = '<h4>وشە بەردەستەکان:</h4>'; 
            let wordsForBank = [...currentCorrectWordSequence]; 
            if (currentSentenceExample.distractors) {
                wordsForBank = wordsForBank.concat(currentSentenceExample.distractors); 
            }
            shuffleArray(wordsForBank); 

            wordsForBank.forEach(wordObj => {
                const wordData = words[Object.keys(words).find(key => words[key] === wordObj)] || wordObj; 
                if (wordData) {
                    const wordCard = createWordCard(wordData);
                    wordBankDiv.appendChild(wordCard);
                } else {
                    console.warn(`Word data not found for object:`, wordObj);
                }
            });

            // Add drop listeners to the word bank
            wordBankDiv.addEventListener('dragover', handleDragOver);
            wordBankDiv.addEventListener('dragenter', handleDragEnterBank);
            wordBankDiv.addEventListener('dragleave', handleDragLeaveBank);
            wordBankDiv.addEventListener('drop', handleDrop);
        }
        
        function createWordCard(wordData) { 
            const card = document.createElement('div');
            card.className = 'word-card';
            card.draggable = true;
            card.textContent = wordData.word_ku;
            const wordIdKey = Object.keys(words).find(key => words[key] === wordData);
            card.dataset.wordId = wordIdKey || 'unknown'; 
            card.dataset.type = wordData.type; 
            card.id = `draggable-${wordIdKey}-${Math.random().toString(16).slice(2)}`; 
            return card;
        }

        // --- DRAG AND DROP LOGIC --- 
        function handleDragStart(e) {
            // Allow dragging only if the target is a word card
            if (e.target.classList.contains('word-card')) {
                draggedWordElement = e.target;
                e.dataTransfer.setData('text/plain', e.target.id);
                e.dataTransfer.effectAllowed = 'move';
                // Use setTimeout to allow the browser to render the drag image before applying style
                setTimeout(() => {
                    if(draggedWordElement) draggedWordElement.classList.add('dragging');
                }, 0); 
            } else {
                e.preventDefault(); // Prevent dragging other elements like slot placeholders
            }
        }
        function handleDragEnd(e) {
            // Remove dragging style regardless of drop success
            if (draggedWordElement) {
                 draggedWordElement.classList.remove('dragging');
            }
             draggedWordElement = null;
             // Clean up any remaining 'over' styles on slots
             document.querySelectorAll('.sentence-slot.over').forEach(el => el.classList.remove('over'));
             // Reset word bank background
             wordBankDiv.style.backgroundColor = '#f0f4f8'; 
        }
        function handleDragOver(e) {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
        }
        function handleDragEnter(e) {
            e.preventDefault();
            // Highlight only if the target is a valid drop zone (slot)
            if (e.target.classList.contains('sentence-slot')) {
                // Prevent highlighting if the slot already contains the item being dragged
                if (!e.target.contains(draggedWordElement)) { 
                    e.target.classList.add('over');
                }
            }
        }
        function handleDragLeave(e) {
            // Remove highlight if leaving a valid drop zone
            if (e.target.classList.contains('sentence-slot')) {
                e.target.classList.remove('over');
            }
        }
         function handleDragEnterBank(e) {
             // Highlight bank only if dragging over the bank itself or its children (excluding the dragged element if it originated there)
             if (e.target === wordBankDiv || (e.target.closest('#word-bank') && (!draggedWordElement || draggedWordElement.parentElement !== wordBankDiv))) {
                 wordBankDiv.style.backgroundColor = '#d6eaf8'; 
             }
         }
         function handleDragLeaveBank(e) {
             // Remove highlight when leaving the bank area
             if (e.target === wordBankDiv || !wordBankDiv.contains(e.relatedTarget)) {
                 wordBankDiv.style.backgroundColor = '#f0f4f8'; 
             }
         }
        
        // *** UPDATED handleDrop Function ***
        function handleDrop(e) {
            e.preventDefault();
            const targetElement = e.target;
            const draggedId = e.dataTransfer.getData('text/plain');
            const draggedEl = document.getElementById(draggedId); 

            if (!draggedEl) return; 

            const originalParent = draggedEl.parentElement; // Store where the card came from

            // Remove visual cues from potential drop targets
            targetElement.classList.remove('over'); 
            wordBankDiv.style.backgroundColor = '#f0f4f8'; 
            document.querySelectorAll('.sentence-slot.over').forEach(el => el.classList.remove('over'));


            // Determine the final destination
            let destination = null;
            if (targetElement.classList.contains('sentence-slot')) {
                destination = targetElement;
            } else if (targetElement === wordBankDiv || targetElement.closest('#word-bank')) {
                destination = wordBankDiv;
            } else if (targetElement.classList.contains('word-card') && targetElement !== draggedEl) {
                // Dropping onto another card - treat as dropping onto its parent
                destination = targetElement.parentElement;
            }

            // --- Handle the drop based on destination ---

            // 1. Dropping into a Sentence Slot
            if (destination && destination.classList.contains('sentence-slot')) {
                // If the slot already has a card, move that card back to the bank first
                if (destination.firstChild && destination.firstChild.classList?.contains('word-card') && destination.firstChild !== draggedEl) {
                     wordBankDiv.appendChild(destination.firstChild);
                }
                destination.textContent = ''; // Clear placeholder
                destination.appendChild(draggedEl); // Place the dragged card
            } 
            // 2. Dropping into the Word Bank
            else if (destination && destination === wordBankDiv) {
                 wordBankDiv.appendChild(draggedEl); // Move card to bank
            }
            // 3. Dropping onto another card (already handled by checking parent above)
            //    Or dropping somewhere invalid - do nothing with placement, but restore original slot if needed

            // --- Restore original slot placeholder ---
            // If the card was moved *from* a slot and its parent has changed
            if (originalParent && originalParent.classList.contains('sentence-slot') && originalParent !== draggedEl.parentElement) {
                const slotType = originalParent.dataset.expectedType;
                originalParent.textContent = kurdishWordTypes[slotType] || slotType; 
            }

            // Final cleanup (redundant due to dragend, but safe)
            draggedEl.classList.remove('dragging');
            draggedWordElement = null;
        }


        // --- SENTENCE CHECKING ---
        function checkConstructedSentence() {
            const slots = sentenceSlotsDiv.querySelectorAll('.sentence-slot');
            let constructedWordIds = []; 
            let allSlotsFilled = true;

            slots.forEach(slot => {
                const wordCard = slot.querySelector('.word-card');
                if (wordCard && wordCard.dataset.wordId && wordCard.dataset.wordId !== 'unknown') {
                    constructedWordIds.push(wordCard.dataset.wordId);
                } else {
                    allSlotsFilled = false; 
                    constructedWordIds.push(null); 
                }
            });

            if (!allSlotsFilled) {
                feedbackArea.textContent = "تکایە هەموو خانەکان پڕ بکەرەوە.";
                feedbackArea.className = 'feedback-incorrect';
                return; 
            }

            const correctWordIds = currentCorrectWordSequence.map(wordObj => {
                 return Object.keys(words).find(key => words[key] === wordObj) || 'unknown';
            });

            let isCorrect = constructedWordIds.length === correctWordIds.length && 
                            constructedWordIds.every((id, index) => id === correctWordIds[index]);

            if (isCorrect) {
                const sentenceText = currentCorrectWordSequence.map(w => w.word_ku).join(' ');
                feedbackArea.textContent = `پیرۆزە! ڕستە دروستەکە بریتییە لە: "${sentenceText}" 👍`;
                feedbackArea.className = 'feedback-correct';
            } else {
                 feedbackArea.textContent = "هەڵەیە. تکایە وشەکان بە ڕیزبەندی دروست دابنێ. 🤔";
                 feedbackArea.className = 'feedback-incorrect';
            }
        }
        
        // --- Hint Function ---
        function showTargetSentenceHint() {
            if (currentSentenceExample && currentSentenceExample.target_sentence_ku) {
                targetSentenceHintArea.textContent = `ڕستەی ئامانج: "${currentSentenceExample.target_sentence_ku}"`;
                targetSentenceHintArea.style.display = 'block'; 
            } else {
                 targetSentenceHintArea.textContent = "هەڵەیەک ڕوویدا لە پیشاندانی ڕستەی ئامانج.";
                 targetSentenceHintArea.style.display = 'block';
            }
        }

        // --- UTILITY FUNCTIONS ---
        function shuffleArray(array) {
            if (!array || array.length === 0) return [];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

    </script>
